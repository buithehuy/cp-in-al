defaults:
  - data: cifar10
  - model: resnet18
  - strategy: entropy
  - trainer: default
  - _self_

# Random seed
seed: 42

# Active Learning setup (override per dataset in data/*.yaml)
# initial_labeled: set per dataset
# calibration_size: set per dataset
# budget_per_round: set per dataset
num_rounds: 21

# Conformal Prediction
cp_alpha: 0.1

# Output
output_dir: ./outputs/${strategy.name}/${now:%Y-%m-%d_%H-%M-%S}
save_results: true
