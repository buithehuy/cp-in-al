name: STL10C
num_classes: 10
root: ./data
batch_size: 128
num_workers: 2

# Corruption settings
corruption: gaussian_noise  # Options: gaussian_noise, shot_noise, impulse_noise, defocus_blur, etc.
severity: 5                 # Severity level (1-5)
corruption_ratio: 0.2       # Fraction of pool data to corrupt (0.0 - 1.0)

# Active Learning parameters (Train size: 5,000)
initial_labeled: 500       # 10% of 5,000
calibration_size: 500      # 10% of 5,000
budget_per_round: 200      # 4,000 / 20 rounds

# STL-10 normalization
mean: [0.4467, 0.4398, 0.4066]
std: [0.2603, 0.2566, 0.2713]
