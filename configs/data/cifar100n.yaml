name: CIFAR100N
num_classes: 100
root: ./data
batch_size: 128
num_workers: 2

# Noise configuration
noise_type: noisy  # Options: clean, noisy, worst
noisy_labels_path: data/CIFAR-100_human.pt

# AL parameters (10%-10%-80% split of 50k training samples)
initial_labeled_pct: 0.1  # 5000 samples
calibration_size_pct: 0.1  # 5000 samples
budget_per_round_pct: 0.02  # 1000 samples per round

# CIFAR-100 normalization
mean: [0.5071, 0.4867, 0.4408]
std: [0.2675, 0.2565, 0.2761]
