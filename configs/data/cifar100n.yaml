name: CIFAR100N
num_classes: 100
root: ./data
batch_size: 128
num_workers: 2

# Noise configuration
noise_type: noisy  # Options: clean, noisy, worst
noisy_labels_path: data/CIFAR-100_human.pt

# Active Learning parameters (Train size: 50,000)
# 10% calibration, 10% initial labeled, 80% pool / 20 rounds
initial_labeled: 5000      # 10% of 50,000
calibration_size: 5000     # 10% of 50,000
budget_per_round: 2000     # 40,000 / 20 rounds

# CIFAR-100 normalization
mean: [0.5071, 0.4867, 0.4408]
std: [0.2675, 0.2565, 0.2761]
