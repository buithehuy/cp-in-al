# CIFAR-10 + OOD noise experiment
name: CIFAR10OOD
num_classes: 10
root: ./data
batch_size: 128
num_workers: 2

# OOD settings
ood_dataset: MNIST          # OOD source: MNIST, FashionMNIST, SVHN
ood_ratio: 0.5              # Fraction of pool that will be OOD (0.5 = 50%)

# Active Learning parameters (Train size: 50,000)
initial_labeled: 5000       # 10%
calibration_size: 5000      # 10%
budget_per_round: 2000      # 20 rounds

# CIFAR-10 normalization
mean: [0.4914, 0.4822, 0.4465]
std: [0.2023, 0.1994, 0.2010]
