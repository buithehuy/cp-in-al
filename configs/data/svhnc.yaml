name: SVHNC
num_classes: 10
root: ./data
batch_size: 128
num_workers: 2

# Corruption settings
corruption: gaussian_noise  # Options: gaussian_noise, shot_noise, impulse_noise, defocus_blur, etc.
severity: 5                 # Severity level (1-5)
corruption_ratio: 0.2       # Fraction of pool data to corrupt (0.0 - 1.0)

# Active Learning parameters (Train size: 73,257)
initial_labeled: 7326      # 10% of 73,257
calibration_size: 7326     # 10% of 73,257
budget_per_round: 2930     # 58,606 / 20 rounds

# SVHN normalization
mean: [0.4377, 0.4438, 0.4728]
std: [0.1980, 0.2010, 0.1970]
